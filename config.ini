; Windows Screen Capture & Object Tracking Configuration
; All values can be modified at runtime via console commands
; or by editing this file (auto-reloads on change)

[FOV]
; Capture region dimensions (centered on screen)
max_x=320
max_y=320
; Center offset from screen center (pixels)
offset_x=0
offset_y=0

[Tracking]
; Master toggle for aim tracking pipeline
enable_aim_tracking=0
; Allow Y-axis to bypass slowdown on downward pull (recoil compensation)
y_axis_freedom=1
; Enable/disable magnetic aim assist system
magnetic_aim_assist=1

[Sensitivity]
; Multiplier applied inside the lock radius
head_aim_sensitivity=0.35
; Maximum pull multiplier in the outer acceleration ring
magnetic_acceleration=2.5
; Correction factor for the friction ring (away resistance)
magnetic_correction=0.15

[RadialZones]
; Inner stop ring radius (pixels) - hard lock
magnetic_lock_radius=5
; Brake ring outer boundary (pixels) - progressive slowdown
progressive_slowdown_radius=80
; Pull ring outer boundary (pixels) - magnetic acceleration
magnetic_acceleration_radius=200
; Away-resistance ring outer boundary (pixels) - friction
magnetic_friction_radius=150

[Capture]
; Frame acquisition method: 0 = DXGI Desktop Duplication
capture_method=0